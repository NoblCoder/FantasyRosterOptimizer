services:
  - type: web
    name: noblcoder-fantasy-roster-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fantasy-roster-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGINS
        value: https://noblcoder.github.io
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: REFRESH_API_KEY
        generateValue: true

databases:
  - name: fantasy-roster-db
    databaseName: roster_iq
    user: roster_iq
    plan: free
